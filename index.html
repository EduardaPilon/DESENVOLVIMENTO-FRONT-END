<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
    </header>

    <main>


        <section aria-labelledby="filtros">
            <div role="status" aria-live="polite"></div>
            
            <h2 id="filtros">Busca e Filtros</h2>

            <form>

                <fieldset> 
                    <p>
                        <label for="ordenacao">Ordenar por:</label>
                        <select id="ordenacao" name="ordenacao">
                            <option value="nenhuma">Nenhuma</option>
                            <option value="prazo">Prazo</option>
                        </select>
                    </p>
                </fieldset>

                <p>
                    <label for="busca">Buscar tarefa:</label>
                    <input type="text" id="busca" name="busca">
                </p>

                <fieldset>
                    <input type="radio" id="todos" name="status" value="Todos" checked>
                    <label for="todos">Todos</label>

                    <input type="radio" id="fazer" name="status" value="a-fazer">
                    <label for="fazer">A Fazer</label>

                    <input type="radio" id="andamento" name="status" value="andamento">
                    <label for="andamento">Em Andamento</label>

                    <input type="radio" id="revisao" name="status" value="revisao">
                    <label for="revisao">Em Revisão</label>

                    <input type="radio" id="concluida" name="status" value="concluida">
                    <label for="concluida">Concluída</label>

                </fieldset>

                <fieldset>
                    <legend>Prioridade</legend>

                    <input type="radio" id="todas" name="prioridade" value="Todas" checked>
                    <label for="todas">Todas</label>

                    <input type="radio" id="baixa" name="prioridade" value="baixa">
                    <label for="baixa">Baixa</label>

                    <input type="radio" id="media" name="prioridade" value="media">
                    <label for="media">Média</label>

                    <input type="radio" id="alta" name="prioridade" value="alta">
                    <label for="alta">Alta</label>

                </fieldset>

            </form>

        </section>

        <section aria-labelledby="status-fazer">
            <h2 id="status-fazer" class="status status-fazer">
                <span class="bolinha" aria-hidden="true"></span>
                A Fazer
            </h2>

            <ul></ul>

        </section>

        <section aria-labelledby="status-andamento">
            <h2 id="status-andamento" class="status status-andamento">
                <span class="bolinha" aria-hidden="true"></span>
                Em Andamento
            </h2>

            <ul></ul>

        </section>

        <section aria-labelledby="status-revisao">
            <h2 id="status-revisao" class="status status-revisao">
                <span class="bolinha" aria-hidden="true"></span>
                Em Revisão
            </h2>

            <ul></ul>

        </section>

        
        <section aria-labelledby="status-concluida">
            <h2 id="status-concluida" class="status status-concluida">
                <span class="bolinha" aria-hidden="true"></span>
                Concluída
            </h2>

            <ul></ul>

        </section>



    </main>

    <footer>
        <p>Nome: Eduarda Pilon Guarino</p>
        <p>Disciplina: Desenvolvimento Frontend - 2026.2</p>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>

</html>
